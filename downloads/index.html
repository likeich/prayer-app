const base = "/prayer-app/";

  const latestEl = document.getElementById('dl-latest');
  const logEl = document.getElementById('dl-changelog');

  const esc = (s) =>
    s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // GitHub release bodies are Markdown; render the small subset they actually
  // use — headings, bullet lists, links, and inline code.
  function renderNotes(md) {
    if (!md || !md.trim()) return '<p class="dl-empty">No release notes.</p>';
    const lines = md.replace(/\r/g, '').split('\n');
    let html = '';
    let inList = false;
    const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
    const inline = (t) =>
      esc(t)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    for (const raw of lines) {
      const line = raw.trimEnd();
      const h = line.match(/^(#{1,6})\s+(.*)$/);
      const li = line.match(/^[-*]\s+(.*)$/);
      if (h) {
        closeList();
        html += `<h4>${inline(h[2])}</h4>`;
      } else if (li) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li>${inline(li[1])}</li>`;
      } else if (line.trim() === '') {
        closeList();
      } else {
        closeList();
        html += `<p>${inline(line)}</p>`;
      }
    }
    closeList();
    return html;
  }

  const fmtDate = (iso) =>
    new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });

  const apkOf = (release) =>
    (release.assets || []).find((a) => a.name.toLowerCase().endsWith('.apk'));

  const fmtSize = (bytes) =>
    bytes ? `${(bytes / 1024 / 1024).toFixed(1)} MB` : '';

  async function load() {
    let releases;
    try {
      const res = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=30`, {
        headers: { Accept: 'application/vnd.github+json' },
      });
      if (!res.ok) throw new Error(`GitHub returned ${res.status}`);
      releases = (await res.json()).filter((r) => !r.draft);
    } catch (err) {
      latestEl.innerHTML = `
        <p class="dl-status dl-error">Couldn't reach GitHub. You can still
        <a href="https://github.com/${repo}/releases/latest">grab the latest release here</a>.</p>`;
      return;
    }

    if (!releases.length) {
      latestEl.innerHTML = `<p class="dl-status">No releases yet.</p>`;
      return;
    }

    const latest = releases[0];
    const apk = apkOf(latest);
    const href = apk ? apk.browser_download_url
      : `https://github.com/${repo}/releases/latest`;
    const size = apk ? fmtSize(apk.size) : '';

    latestEl.innerHTML = `
      <a class="dl-button" href="${href}">
        <svg class="dl-button-logo" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85-.29-.15-.65-.06-.83.22l-1.88 3.24c-2.86-1.21-6.08-1.21-8.94 0L5.65 5.67c-.19-.29-.57-.38-.87-.2-.28.18-.37.54-.22.83L6.4 9.48C3.3 11.25 1.28 14.44 1 18h22c-.28-3.56-2.3-6.75-5.4-8.52zM7 15.25c-.69 0-1.25-.56-1.25-1.25s.56-1.25 1.25-1.25S8.25 13.31 8.25 14 7.69 15.25 7 15.25zm10 0c-.69 0-1.25-.56-1.25-1.25s.56-1.25 1.25-1.25 1.25.56 1.25 1.25-.56 1.25-1.25 1.25z"/>
        </svg>
        Download now
      </a>
      <p class="dl-button-note">${esc(latest.tag_name)}${size ? ` · ${size}` : ''}</p>`;

    logEl.innerHTML = releases
      .map((r) => {
        const a = apkOf(r);
        const dl = a
          ? `<a class="dl-asset" href="${a.browser_download_url}">Download APK${a.size ? ` (${fmtSize(a.size)})` : ''}</a>`
          : '';
        return `
          <article class="dl-release">
            <header class="dl-release-head">
              <h3>${esc(r.name || r.tag_name)}</h3>
              <span class="dl-release-date">${fmtDate(r.published_at)}</span>
            </header>
            <div class="dl-notes">${renderNotes(r.body)}</div>
            ${dl}
          </article>`;
      })
      .join('');
  }

  load();
})();</script> <!-- Global: most of this page's content is injected at runtime via innerHTML,
